name: Check
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bun:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run build
      - run: git diff --exit-code -- types
      - run: bun run test
      - run: bun run test:compile
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache-dependency-path: interop/go.sum
      - run: bun run test:interop
